name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0-alpha)"
        required: true
        type: string
      skipImages:
        description: "Skip OS image builds?"
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/airframesio
  # Keep BUILD_REF in sync with the pin in armbian/build.sh (single source of truth).
  BUILD_REPOSITORY: armbian/build
  BUILD_REF: v26.2.1
  USERPATCHES_REPOSITORY: airframesio/airwaves-os
  USERPATCHES_DIR: armbian/userpatches
  CONTROL_APP_REPO: airframesio/airwaves-os-control

jobs:

  build-manager:
    name: Build manager container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/airwaves-manager
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: containers/airwaves-manager
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-gateway:
    name: Build gateway container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Clone control app
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONTROL_APP_REPO }}
          path: containers/airwaves-gateway/control-app
          token: ${{ secrets.CONTROL_APP_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/airwaves-gateway
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: containers/airwaves-gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  export-tarballs:
    name: Export tarballs (${{ matrix.arch }})
    needs: [build-manager, build-gateway]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export images
        run: |
          for image in airwaves-gateway airwaves-manager; do
            docker pull --platform "linux/${{ matrix.arch }}" "${{ env.IMAGE_PREFIX }}/${image}:latest"
            # The runner's containerd image store only holds this platform's
            # layers, so a plain save of the multi-arch tag fails on arm64
            # ("content digest ... not found", v1.0.38). Save just this platform.
            docker save --platform "linux/${{ matrix.arch }}" "${{ env.IMAGE_PREFIX }}/${image}:latest" -o "${image}-${{ matrix.arch }}.tar"
          done
      - name: Generate SHA256 checksums
        run: |
          for f in *.tar; do
            sha256sum "$f" > "$f.sha256"
          done
          cat *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: container-tarballs-${{ matrix.arch }}
          path: |
            *.tar
            *.tar.sha256
          retention-days: 7

  create-release:
    name: Create release
    needs: [build-manager, build-gateway, export-tarballs]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: container-tarballs-*
          merge-multiple: true
          path: artifacts/

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_VERSION:-$REF_NAME}" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Airwaves OS ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            artifacts/*.tar
            artifacts/*.tar.sha256

  # OS images and network installers for the boards Airframes Desktop can
  # install over the network, built from this tag (they pull the manager and
  # gateway the jobs above just pushed, pinned in releases/<channel>.json).
  # Other boards are still built by hand with "Build OS Image (Simple)".
  images:
    name: Image ${{ matrix.board }} (${{ matrix.release }})
    needs: [build-manager, build-gateway]
    if: ${{ github.event.inputs.skipImages != 'yes' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { board: uefi-x86, release: trixie, branch: current }
          - { board: rpi4b, release: noble, branch: current }
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-image-simple.yml
    with:
      board: ${{ matrix.board }}
      release: ${{ matrix.release }}
      branch: ${{ matrix.branch }}
      bundle_containers: true
      channel: ${{ (contains(github.ref_name, '-dev') || contains(github.event.inputs.version, '-dev')) && 'dev' || ((contains(github.ref_name, '-beta') || contains(github.event.inputs.version, '-beta')) && 'beta' || 'stable') }}
      upload_to_release: false
    secrets: inherit

  # Attach the images and network installers, then SHA256SUMS over every asset
  # signed with minisign (docs/NETBOOT.md "Signatures"). Desktop and the network
  # installer refuse images that are not in a signed SHA256SUMS.
  attach-images:
    name: Attach images and signed checksums
    needs: [create-release, images]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download containers, images and network installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_VERSION:-$REF_NAME}" >> $GITHUB_OUTPUT

      - name: SHA256SUMS
        working-directory: artifacts
        run: |
          set -euo pipefail
          ls -lh
          shopt -s nullglob
          files=( *.tar *.img.xz )
          [ ${#files[@]} -gt 0 ] || { echo "::error::nothing to checksum"; exit 1; }
          sha256sum "${files[@]}" | LC_ALL=C sort -k2 > SHA256SUMS
          # Every per-file .sha256 must agree with SHA256SUMS.
          for f in *.sha256; do
            want="$(cut -d' ' -f1 "$f")"; name="${f%.sha256}"
            got="$(awk -v n="$name" '$2 == n {print $1}' SHA256SUMS)"
            [ -z "$got" ] || [ "$got" = "$want" ] || { echo "::error::$name: $f disagrees with SHA256SUMS"; exit 1; }
          done
          cat SHA256SUMS

      - name: Sign SHA256SUMS (minisign)
        working-directory: artifacts
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::warning::MINISIGN_SECRET_KEY is not set: SHA256SUMS is not signed, so Desktop shows these images as checksum only and the network installer refuses them."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y minisign >/dev/null
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          if [ -n "${MINISIGN_PASSWORD}" ]; then
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/minisign.key" -m SHA256SUMS -t "Airwaves OS ${TAG} SHA256SUMS"
          else
            minisign -S -s "$RUNNER_TEMP/minisign.key" -m SHA256SUMS -t "Airwaves OS ${TAG} SHA256SUMS" </dev/null
          fi
          rm -f "$RUNNER_TEMP/minisign.key"
          # The key in the repository (built into the installer and Desktop) must match.
          minisign -V -p "$GITHUB_WORKSPACE/netinstall/minisign.pub" -m SHA256SUMS
          # And the installer's own verifier must accept it.
          sh "$GITHUB_WORKSPACE/netinstall/minisign-verify" "$GITHUB_WORKSPACE/netinstall/minisign.pub" SHA256SUMS SHA256SUMS.minisig

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            artifacts/*.img.xz
            artifacts/*.img.xz.sha256
            artifacts/netinstall-*.tar
            artifacts/netinstall-*.tar.sha256
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.minisig
